<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Hamburger Menu</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

/* Navigation Bar */
.topnav{
    background:#222;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
    position:relative;
}

/* Logo */
.logo{
    color:white;
    font-size:24px;
    font-weight:bold;
    padding:15px 0;
    text-decoration:none;
}

/* Menu Links */
#myLinks{
    display:flex;
}

#myLinks a{
    color:white;
    text-decoration:none;
    padding:20px 15px;
    transition:0.3s;
}

#myLinks a:hover{
    background:white;
    color:black;
}

/* Hamburger Icon */
.icon{
    display:none;
    color:white;
    font-size:26px;
    cursor:pointer;
}

/* Responsive Design */
@media(max-width:768px){

    .topnav{
        flex-direction:column;
        align-items:flex-start;
    }

    #myLinks{
        display:none;
        flex-direction:column;
        width:100%;
    }

    #myLinks a{
        width:100%;
        border-top:1px solid #444;
    }

    .icon{
        display:block;
        position:absolute;
        right:20px;
        top:18px;
    }

    #myLinks.show{
        display:flex;
    }
}

</style>
</head>

<body












<div class="topnav">

    <!-- Logo -->
    <a href="#" class="logo">Logo</a>

    <!-- Menu Links -->
    <div id="myLinks">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </div>

    <!-- Hamburger Icon -->
    <i class="fa fa-bars icon" onclick="myFunction()"></i>

</div>

<script>

function myFunction(){
    document.getElementById("myLinks").classList.toggle("show");
}

</script>

</body>
</html>
